<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13111d">
<link rel="manifest" href="manifest.webmanifest">

<title>Daggerheart Karakterlapok</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: a sticky "vitals ledger" (HP / Stress / Armor / Hope / thresholds) above tabbed work areas; Hope is gold, Fear is violet, everywhere. */
:root{
  --bg:#eceaf2; --surface:#f7f6fb; --raised:#ffffff; --ink:#1d1a2f; --muted:#5f5a76; --line:#cdc8dc;
  --hope:#8a6100; --hope-soft:#f4e6bd; --fear:#5a3d99; --fear-soft:#e3daf6; --on-accent:#ffffff;
  --danger:#b3261e; --danger-soft:#f7dcd9; --ok:#27704a; --ok-soft:#d9efe2;
  --display:'Alegreya',Georgia,'Times New Roman',serif; --body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
  /* domain colours: each carries white text, so they read the same in both themes */
  --d-arcana:#6a4ba3; --d-blade:#a5313b; --d-bone:#636a78; --d-codex:#2c5c9c; --d-grace:#ab3f7b; --d-midnight:#2b2d55; --d-sage:#2c754b; --d-splendor:#8d680c; --d-valor:#b0561a;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13111d; --surface:#1b182a; --raised:#252139; --ink:#ece9f7; --muted:#a59fc0; --line:#3a3455;
  --hope:#e6b94e; --hope-soft:#3b3015; --fear:#b7a1f2; --fear-soft:#2e2452; --on-accent:#1a1400;
  --danger:#f2847c; --danger-soft:#47201d; --ok:#74d39c; --ok-soft:#173526; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#13111d; --surface:#1b182a; --raised:#252139; --ink:#ece9f7; --muted:#a59fc0; --line:#3a3455;
  --hope:#e6b94e; --hope-soft:#3b3015; --fear:#b7a1f2; --fear-soft:#2e2452; --on-accent:#1a1400;
  --danger:#f2847c; --danger-soft:#47201d; --ok:#74d39c; --ok-soft:#173526; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg) radial-gradient(1100px 420px at 50% -120px,var(--fear-soft),transparent) no-repeat;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.35rem;font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
i.en{font-style:italic;color:var(--muted);font-size:.82em;margin-left:.4em;font-weight:400;font-family:var(--body)}
.orig{color:var(--muted);font-style:italic;font-size:.9em}
.muted{color:var(--muted)} .small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0;width:100%}
textarea{resize:vertical;line-height:1.4}
input[type=number]{width:5.2em}
:focus-visible{outline:2px solid var(--fear);outline-offset:2px}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--hope);border-color:var(--hope);color:var(--on-accent);font-weight:700}
.btn.fear{background:var(--fear);border-color:var(--fear);color:var(--on-accent);font-weight:700}
.btn.warn{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:2px 9px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.top{align-items:flex-start}
.grow{flex:1 1 0;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g6{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted);min-width:0}
label.f>*{font-size:1rem;color:var(--ink)}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:14px}
.bar .row{row-gap:6px}
.bar select{width:auto;max-width:100%}
.chip{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:1px 10px;color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok)} .chip.bad{color:var(--danger);border-color:var(--danger)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:thin}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:6px 12px;cursor:pointer;white-space:nowrap;font-family:var(--display);font-weight:700;font-size:1.02rem;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--hope)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.panel>h2,.panel>h3{margin-bottom:10px}
.panel h2::before{content:"";display:inline-block;width:9px;height:9px;background:var(--hope);transform:rotate(45deg);margin:0 12px 2px 3px;box-shadow:5px -5px 0 0 var(--fear);vertical-align:middle}
section.blk{display:flex;flex-direction:column;gap:14px}
hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}

/* vitals ledger */
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px 22px;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:14px 16px;margin-bottom:14px}
.vital .lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.pips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pip{width:22px;height:22px;border:2px solid var(--muted);background:transparent;border-radius:4px;cursor:pointer;padding:0}
.pip.on{background:var(--danger);border-color:var(--danger)}
.pip.stress.on{background:var(--fear);border-color:var(--fear)}
.pip.armor{border-radius:4px 4px 11px 11px}
.pip.armor.on{background:var(--muted);border-color:var(--muted)}
.pip.hope{transform:rotate(45deg) scale(.82);border-color:var(--hope)}
.pip.hope.on{background:var(--hope)}
.pip.scar{border-style:dashed;opacity:.4;cursor:not-allowed}
.thr{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:4px;font-size:.85rem;text-align:center}
.thr button{flex:1;padding:5px 4px;min-width:0;background:var(--raised);border:0;cursor:pointer;line-height:1.25}
.thr button:hover{background:var(--danger-soft)} .thr button:active{background:var(--danger);color:var(--on-accent)} .thr button:active .muted{color:inherit}
.thr b{flex:0 0 auto;margin:0 -6px;position:relative;z-index:1;pointer-events:none;background:var(--ink);color:var(--bg);padding:3px 16px 3px 14px;font-size:1.1rem;display:flex;align-items:center;font-family:var(--display);clip-path:polygon(0 0,82% 0,100% 50%,82% 100%,0 100%,14% 50%)}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(115deg,var(--c1),var(--c2));color:#fff;border-radius:10px 10px 0 0;padding:14px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-60px;width:220px;height:220px;transform:rotate(45deg);border:2px solid rgba(255,255,255,.18);box-shadow:0 0 0 14px rgba(255,255,255,.06),0 0 0 30px rgba(255,255,255,.04);pointer-events:none}
.hero .nm{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.05;text-wrap:balance}
.hero .sub{opacity:.95;margin-top:2px} .hero i.en{color:rgba(255,255,255,.78)}
.hero .tag{background:rgba(255,255,255,.2);color:#fff} .hero .tag.cond{background:#fff;color:#7a1810;font-weight:700}
.hero .lvl{display:grid;place-items:center;width:70px;height:78px;background:#fff;color:#1d1a2f;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);padding-bottom:12px;position:relative;z-index:1;flex:0 0 auto}
.hero .lvl span{font-size:.62rem;letter-spacing:.1em;font-weight:700;align-self:end} .hero .lvl b{font-family:var(--display);font-size:1.9rem;line-height:1;align-self:start}
.portrait{flex:0 0 auto;width:84px;height:105px;border-radius:42px 42px 10px 10px;border:3px solid #fff;overflow:hidden;cursor:pointer;display:grid;place-items:center;background:rgba(0,0,0,.25);position:relative;z-index:1}
.portrait img{width:100%;height:100%;object-fit:cover;display:block} .portrait span{font-family:var(--display);font-size:2.6rem;font-weight:800;color:rgba(255,255,255,.85)}
.portrait:hover{border-color:var(--hope-soft)}
.shield{display:grid;place-items:center;width:56px;height:62px;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1;padding-bottom:9px}
.shield.arm{background:var(--muted)}
.badge{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.badges{display:flex;flex-wrap:nowrap;gap:12px;align-items:flex-start;justify-content:space-between}
.badge{flex:1 1 0;min-width:0}
.badge .lbl{display:block;justify-content:center;white-space:nowrap}
.badge .lbl i.en{display:block;margin:0;text-transform:none;letter-spacing:0}
.profdots{display:flex;gap:3px;height:62px;align-items:center} .profdots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--hope);margin:0} .profdots i.on{background:var(--hope)}

.trait{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:12px 8px 10px;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center}
.trait .tn{font-family:var(--display);font-weight:700;font-size:1.05rem}
.trait.marked{border-color:var(--hope)} .trait.marked .shield{background:var(--hope);color:var(--on-accent)}
.stat{display:flex;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.stat:last-child{border-bottom:0}
.stat .v{font-family:var(--display);font-weight:800;font-size:1.5rem;min-width:2.2em;text-align:right}
.stat .why{font-size:.84rem;color:var(--muted)}
.feat{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:3px}
.feat:last-child{border-bottom:0}
.feat .src{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--raised);cursor:pointer;line-height:1;padding:0}
.step b{min-width:1.6em;text-align:center}
.tag{display:inline-block;font-size:.78rem;border-radius:4px;padding:0 7px;background:var(--fear-soft);color:var(--ink);white-space:nowrap}
.tag.h{background:var(--hope-soft)} .tag.d{background:var(--danger-soft)} .tag.g{background:var(--ok-soft)}
.note{border-left:3px solid var(--hope);padding:6px 10px;background:var(--hope-soft);border-radius:0 6px 6px 0;font-size:.93rem}
.note.f{border-color:var(--fear);background:var(--fear-soft)}
.note.d{border-color:var(--danger);background:var(--danger-soft)}
.note.g{border-color:var(--ok);background:var(--ok-soft)}

.dice{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.die{width:58px;height:58px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.6rem;clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%)}
.die.h{background:var(--hope);color:var(--on-accent)} .die.f{background:var(--fear);color:var(--on-accent)}
.die.x{background:var(--line);color:var(--ink);width:44px;height:44px;font-size:1.2rem}
.total{font-family:var(--display);font-weight:800;font-size:2.3rem;line-height:1}
.card{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.cardhead{background:var(--dom);color:#fff;margin:-10px -10px 0;padding:9px 12px}
.cardhead .tag{background:rgba(255,255,255,.22);color:#fff} .cardhead i.en{color:rgba(255,255,255,.8)}
.card.vault .cardhead{filter:saturate(.4) brightness(.9)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hist{max-height:260px;overflow:auto;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
details>summary{cursor:pointer;font-weight:700;font-family:var(--display)}
details[open]>summary{margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.opt:last-child{border-bottom:0}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font-size:.82rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.steps span.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
a{color:var(--fear)}
h4{font-size:1.05rem;font-family:var(--display);margin:0} h5{font-size:1rem;font-family:var(--display);margin:0} h6{font-size:.92rem;margin:0;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
mark{background:var(--hope-soft);color:var(--ink);border-radius:2px;padding:0 1px;box-shadow:0 0 0 1px var(--hope)}
.ctext{font-size:.95rem;display:flex;flex-direction:column;gap:6px}
.ctext ul,.ctext ol,.rules ul,.rules ol{margin:0;padding-left:20px}
.catrow{border-bottom:1px dashed var(--line);padding-bottom:6px}
.catrow summary{font-size:1rem}
blockquote{margin:0;padding:6px 12px;border-left:3px solid var(--fear);background:var(--fear-soft);border-radius:0 6px 6px 0;display:flex;flex-direction:column;gap:6px}
.rules{line-height:1.55;display:flex;flex-direction:column;gap:14px}
.rules section{display:flex;flex-direction:column;gap:9px;scroll-margin-top:150px}
.rules section>p,.rules section>ul,.rules section>ol,.rules section>blockquote{max-width:74ch}
.rules h2.mh{font-size:1.7rem} .rules h3.mh{font-size:1.4rem;border-bottom:2px solid var(--hope);padding-bottom:2px} .rules h4.mh{font-size:1.2rem;margin-top:8px} .rules h5.mh{font-size:1.05rem;margin-top:4px}
.reslist{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--raised)}
.res{display:block;padding:6px 10px;border-bottom:1px dashed var(--line);text-decoration:none;color:inherit}
.res:hover,.res:focus-visible{background:var(--surface)}
#printArea{display:none}
@media print{
 .wrap{display:none!important}
 body{background:#fff!important}
 #printArea{display:block;font:11pt/1.4 Georgia,serif;color:#000}
 #printArea h1{font-size:22pt;margin:0 0 4px} #printArea h2{font-size:14pt;border-bottom:1px solid #999;margin:16px 0 6px;break-after:avoid} #printArea h3{font-size:12pt;margin:12px 0 2px;break-after:avoid} #printArea h4{font-size:11pt;margin:10px 0 2px;break-after:avoid;font-family:Georgia,serif}
 #printArea p{margin:4px 0} #printArea table{width:auto;margin:6px 0;font-size:10pt} #printArea th,#printArea td{border:1px solid #999;padding:3px 8px}
 #printArea .dhdata{font:5.5pt/1.15 "Courier New",monospace;word-break:break-all;color:#777;break-inside:avoid;font-variant-ligatures:none;margin-top:16px} #printArea .pport{float:right;width:120px;border:2px solid #999;border-radius:8px;margin:0 0 8px 12px}
 #printArea blockquote{display:block;background:none;border-left:2px solid #999;color:#444;font-style:italic;margin:4px 0;padding:0 0 0 10px} #printArea ul{margin:4px 0;padding-left:20px} #printArea .scroll{overflow:visible}
}
@media (prefers-reduced-motion:no-preference){ .die{animation:pop .25s ease-out} @keyframes pop{from{transform:scale(.6) rotate(-20deg)}to{transform:none}} }
</style>

<div class="wrap">
  <header class="bar" id="bar"></header>
  <main id="main"></main>
</div>
<div id="printArea"></div>
<script src="data/srd-data.js"></script>
<script src="data/srd-rules.js"></script>

<script>
"use strict";
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const b=(hu,en)=>({hu,en});
let lang='hu';
const L=(hu,en)=>lang==='hu'?hu:en;
const T=(hu,en)=>lang==='hu'&&hu!==en?`${hu}<i class="en">${en}</i>`:en;
const N=o=>T(o.hu,o.en);
const P=o=>lang==='hu'?o.hu:o.en;
const TX=o=>lang==='hu'?`<p>${o.hu}</p><p class="orig">${mdl(o.en)}</p>`:`<p>${mdl(o.en)}</p>`;
const sgn=n=>(n>=0?'+':'−')+Math.abs(n);
const rnd=n=>Math.floor(Math.random()*n)+1;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const uid6=()=>Math.random().toString(36).slice(2,10);
const clamp=(n,a,z)=>Math.max(a,Math.min(z,n));
const getP=(o,p)=>p.split('.').reduce((x,k)=>x==null?x:x[k],o);
const setP=(o,p,v)=>{const ks=p.split('.');const l=ks.pop();const t=ks.reduce((x,k)=>x[k]??(x[k]={}),o);t[l]=v};
const fid=p=>'i_'+p.replace(/[^a-z0-9]/gi,'_');
/* tiny markdown renderer (SRD text, card text, exported sheet) */
function mdi(s){s=esc(s);
 s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,u)=>u[0]==='#'?`<a href="#rules" data-act="ruleGo" data-slug="${u.slice(1)}">${t}</a>`:/^https?:/.test(u)?`<a href="${u}" target="_blank" rel="noopener">${t}</a>`:t);
 return s.replace(/\*\*_(.+?)_\*\*/g,'<b><em>$1</em></b>').replace(/_\*\*(.+?)\*\*_/g,'<b><em>$1</em></b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[\s(>])_([^_]+?)_(?=[\s.,;:!?)<]|$)/g,'$1<em>$2</em>').replace(/(^|[\s(>])\*([^*\s][^*]*?)\*(?=[\s.,;:!?)<]|$)/g,'$1<em>$2</em>')}
function md(src){const Ls=String(src||'').replace(/\r/g,'').split('\n');let h='',i=0;const isLi=l=>/^\s*([-*+]|\d+\.)\s+/.test(l);
 while(i<Ls.length){const l=Ls[i];let m;
  if(!l.trim()){i++;continue}
  if((m=/^(#{1,6})\s+(.*)$/.exec(l))){h+=`<h${m[1].length} class="mh">${mdi(m[2])}</h${m[1].length}>`;i++;continue}
  if(l.trim()[0]==='|'){const rows=[];while(i<Ls.length&&Ls[i].trim()[0]==='|'){rows.push(Ls[i].trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim()));i++}
   const body=rows.filter(r=>!r.every(c=>/^:?-+:?$/.test(c)));h+=`<div class="scroll"><table>${body.map((r,j)=>`<tr>${r.map(c=>j?`<td>${mdi(c)}</td>`:`<th>${mdi(c)}</th>`).join('')}</tr>`).join('')}</table></div>`;continue}
  if(/^\s*>/.test(l)){const q=[];while(i<Ls.length&&/^\s*>/.test(Ls[i])){q.push(Ls[i].replace(/^\s*>\s?/,''));i++}h+=`<blockquote>${md(q.join('\n'))}</blockquote>`;continue}
  if(isLi(l)){const ord=/^\s*\d+\./.test(l),it=[];
   while(i<Ls.length){if(isLi(Ls[i])){it.push(Ls[i].replace(/^\s*([-*+]|\d+\.)\s+/,''));i++}else if(Ls[i].trim()&&/^\s{2,}/.test(Ls[i])){it[it.length-1]+=' '+Ls[i].trim();i++}else if(!Ls[i].trim()&&i+1<Ls.length&&isLi(Ls[i+1]))i++;else break}
   h+=`<${ord?'ol':'ul'}>${it.map(x=>`<li>${mdi(x)}</li>`).join('')}</${ord?'ol':'ul'}>`;continue}
  const p=[];while(i<Ls.length&&Ls[i].trim()&&!/^(#{1,6}\s|\s*>|\s*\|)/.test(Ls[i])&&!isLi(Ls[i])){p.push(Ls[i].trim());i++}
  h+=`<p>${mdi(p.join(' '))}</p>`}
 return h}

function featLine(g){if(!g||!g.featName)return '';const h=FEATHU[g.featName],nums=g.featText.match(/\d+/g)||[];
 if(lang==='hu'&&h)return `<p class="small" style="margin-top:4px"><b>${T(h[0],esc(g.featName))}:</b> ${typeof h[1]==='function'?h[1](nums):h[1]} <span class="orig">${mdi(g.featText)}</span></p>`;
 return `<p class="small" style="margin-top:4px"><b>${esc(g.featName)}:</b> ${mdi(g.featText)}</p>`}
// reads the mechanical part of a weapon/armor feature so the sheet can apply it
function gearFx(text){const o={};if(!text)return o;const re=/([+-]\d+) to ([^;.]+)/g;let m;
 while((m=re.exec(text))){const v=+m[1],t=m[2].trim();
  if(/^all character traits and Evasion/i.test(t)){for(const k of ['agi','str','fin','ins','pre','kno','eva'])o[k]=(o[k]||0)+v}
  else if(t==='Evasion')o.eva=(o.eva||0)+v;else if(t==='Armor Score')o.armor=(o.armor||0)+v;else if(TKEY[t])o[TKEY[t]]=(o[TKEY[t]]||0)+v;
  else if(/^attack rolls/.test(t))o.atk=v;else if(/^primary weapon damage/.test(t))o.paired=v;else if(/^Severe damage threshold/.test(t))o.severe=v}
 if(/additional damage die and discard the lowest/.test(text))o.extraDie=1;
 if(/damage rolls equal to your level/.test(text))o.dmgLevel=1;if(/damage rolls equal to your Agility/.test(text))o.dmgAgi=1;return o}

for(const k in ANC){const x=SRD.ancestries[ANC[k].en];if(!x)continue;ANC[k].desc=x.desc;ANC[k].f.forEach(f=>{const y=x.feat.find(z=>z.name===f.n.en);if(y)f.t.en=y.text})}
for(const k in COMM){const x=SRD.communities[COMM[k].en];if(!x)continue;COMM[k].desc=x.desc;if(x.feat[0])COMM[k].t.en=x.feat[0].text}

function normalize(c){
 for(const k of ['primary','secondary']){const w=c[k];if(w&&w.name==null){const n=OLDP[(w.tier||1)-1]+((OLDW[w.slot]||[])[w.key]||'');const f=wFind(n);c[k]=f?Object.assign(mkWeapon(f),{custom:w.custom||''}):Object.assign(w,{name:n||'?',featName:'',featText:''})}}
 if(c.armor&&c.armor.name==null){const n=OLDP[(c.armor.tier||1)-1]+(OLDA[c.armor.key]||'');const f=aFind(n);c.armor=f?Object.assign(mkArmor(f),{custom:c.armor.custom||''}):Object.assign(c.armor,{name:n||'?',featName:'',featText:''})}
 (c.cards||[]).forEach(k=>{const i=cardInfo(k);if(i){k.type=i.type;k.recall=i.recall;k.level=i.level}else k.custom=true;if(k.notes==null)k.notes=k.text||'';delete k.text});
 (c.items||[]).forEach(i=>{if(i.desc==null)i.desc=''});return c}

function derive(c){
 const cls=CLASSES[c.classId],lvl=c.level,tier=tierOf(lvl);
 const adv=c.levelUps.flatMap(l=>l.adv.map(a=>({...a,level:l.level})));
 const cnt=t=>adv.filter(a=>a.type===t).length;
 const subTier=Math.min(3,1+cnt('subclass'));
 const eq=[c.armor,c.primary,c.secondary].filter(Boolean).map(e=>gearFx(e.featText));
 const fx=k=>eq.reduce((s,o)=>s+(o[k]||0),0);
 const parts=(arr)=>({v:arr.reduce((s,p)=>s+p[1],0),why:arr.filter(p=>p[1]).map(p=>`${p[0]} ${sgn(p[1])}`).join(' · ')});
 const prof=parts([[L('alap','base'),1],[L('fokozat','tier'),tier-1],[L('fejlesztés','advancement'),cnt('proficiency')],[L('egyéni','manual'),c.mods.proficiency]]);
 const traits={},marked={};
 for(const t of TRAITS){const up=adv.filter(a=>a.type==='traits'&&a.traits.includes(t.id));
  traits[t.id]=parts([[L('alap','base'),c.traits[t.id]],[L('fejlesztés','advancement'),up.length],[L('felszerelés','gear'),fx(t.id)]]);

 const hpS=parts([[P(cls),cls.hp],[P(ANC.giant),c.anc1==='giant'?1:0],[L('fejlesztés','advancement'),cnt('hp')],['School of War',c.subId==='war'?1:0],[L('egyéni','manual'),c.mods.hp]]);
 const stS=parts([[L('alap','base'),6],[P(ANC.human),c.anc1==='human'?1:0],[L('fejlesztés','advancement'),cnt('stress')],['Vengeance',c.subId==='vengeance'?1:0],[L('egyéni','manual'),c.mods.stress]]);
 hpS.v=clamp(hpS.v,1,12);stS.v=clamp(stS.v,1,12);
 const armor=parts([[L('páncél','armor'),c.armor?c.armor.score:0],[L('felszerelés','gear'),fx('armor')],[L('egyéni','manual'),c.mods.armor]]);armor.v=clamp(armor.v,0,12);
 const thrB=[[P(ANC.galapa),c.anc1==='galapa'?prof.v:0],['Stalwart',c.subId==='stalwart'?[1,3,6][subTier-1]:0]];
 const major=parts([[c.armor?L('páncél','armor'):L('páncél nélkül','unarmored'),c.armor?c.armor.major:0],[L('szint','level'),lvl],...thrB,[L('egyéni','manual'),c.mods.major]]);
 const severe=parts([[c.armor?L('páncél','armor'):L('páncél nélkül','unarmored'),c.armor?c.armor.severe:lvl],[L('szint','level'),lvl],...thrB,[L('felszerelés','gear'),fx('severe')],[L('egyéni','manual'),c.mods.severe]]);
 const exps=c.experiences.map((e,i)=>2+adv.filter(a=>a.type==='exp'&&a.idx.includes(i)).length+(c.anc1==='clank'&&c.clankExp===i?1:0)+(e.mod||0));
 const sub=cls.subs.find(s=>s.id===c.subId)||cls.subs[0];

 const domains=[...cls.domains];let mcDom=null;if(c.multiclass&&c.multiclass.domain){mcDom=c.multiclass.domain}
 return {cls,sub,lvl,tier,adv,cnt,subTier,prof,traits,marked,evasion,hpS,stS,armor,major,severe,exps,hopeMax:6-c.scars,expectCards,domains,mcDom,mcCap:Math.ceil(lvl/2),
  burden:(c.primary?+c.primary.hands:0)+(c.secondary?+c.secondary.hands:0),paired:c.secondary?gearFx(c.secondary.featText).paired||0:0};
}

/* ============ persistence ============ */
const LS='dh-sheets-v1';let db=null,base=null,dirty=new Set(),flushT=null;
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS));if(j&&Array.isArray(j.chars))S=Object.assign(S,j)}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function touch(c){c=c||cur();if(c){c.updatedAt=Date.now();delete c.example;dirty.add(c.id)}saveLocal();if(db){setSync('saving');clearTimeout(flushT);flushT=setTimeout(flush,1500)}}
function setSync(s){ui.sync=s;const el=$('#sync');if(el){el.className='chip '+(s==='saved'?'ok':s==='error'?'bad':'');el.textContent=syncText()}}
const syncText=()=>({saved:L('Mentve a fiókodba','Saved to your account'),saving:L('Mentés…','Saving…'),local:IN_ARTIFACT?L('Mentve ezen az eszközön','Saved on this device'):L('Mentve ebben a böngészőben','Saved in this browser'),error:L('Fiókmentés sikertelen – helyben megvan','Account save failed – kept locally')}[ui.sync]);
async function flush(){if(!db)return;const ids=[...dirty];dirty.clear();try{
  for(const id of ids){const c=S.chars.find(x=>x.id===id);if(!c||c.example)continue;await db.collection(base).doc(id).set({kind:'char',name:c.name||'',updatedAt:c.updatedAt,json:JSON.stringify(c)})}
  setSync('saved')}catch(e){ids.forEach(i=>dirty.add(i));setSync('error')}}
async function initRemote(){try{
  if(!window.claude||!window.claude.use)return;
  const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!d||!u)return;
  const id=await u.id();if(!id)return;base='data/users/'+id;
  const snap=await d.collection(base).get();db=d;
  let remoteDel=[],n=0;
  for(const doc of snap.docs){const x=doc.data()||{};if(doc.id==='meta-deleted'){remoteDel=x.ids||[];continue}
   if(x.kind!=='char'||!x.json)continue;if(S.deleted.includes(doc.id)){d.collection(base).doc(doc.id).delete().catch(()=>{});continue}
   n++;let rc;try{rc=JSON.parse(x.json)}catch(e){continue}
   const i=S.chars.findIndex(c=>c.id===doc.id);if(i<0)S.chars.push(rc);else if((rc.updatedAt||0)>(S.chars[i].updatedAt||0))S.chars[i]=rc;else if((rc.updatedAt||0)<(S.chars[i].updatedAt||0))dirty.add(doc.id)}
  S.chars=S.chars.filter(c=>!remoteDel.includes(c.id));S.deleted=[...new Set([...S.deleted,...remoteDel])];
  const rids=snap.docs.map(x=>x.id);S.chars.forEach(c=>{if(!rids.includes(c.id)&&!c.example)dirty.add(c.id)});
  if(n&&S.chars.some(c=>!c.example))S.chars=S.chars.filter(c=>!c.example);
  if(!S.chars.find(c=>c.id===S.cur))S.cur=S.chars[0]&&S.chars[0].id;
  S.chars.forEach(normalize);saveLocal();render();if(dirty.size){setSync('saving');flush()}else setSync('saved');
 }catch(e){db=null;setSync('local')}}

function weaponEditor(c,d,slot){const key=slot===1?'primary':'secondary',w=c[key],ft=ui.wTier[key]||(w&&w.tier)||d.tier;
 const list=WCAT.map((x,i)=>[x,i]).filter(([x])=>x.slot===slot&&x.tier===ft);
 const pickSel=`<select id="wp_${key}" data-chg="setWeapon" data-k="${key}"><option value="">${w?L('— csere a katalógusból —','— swap from catalog —'):L('— válassz —','— choose —')}</option>${list.map(([x,i])=>`<option value="${i}">${esc(gPlain(x))} · ${P(TR[x.trait])} · ${P(RANGES[x.range])} · d${x.die}${x.bonus?'+'+x.bonus:''} ${x.dtype==='mag'?'mag':x.dtype==='both'?'phy/mag':'phy'} · ${x.hands}${L(' kéz','H')}${x.featName?' · '+esc(x.featName):''}</option>`).join('')}${w?`<option value="none">${L('✕ levétel','✕ unequip')}</option>`:''}</select>`;
 let h=`<div class="grid g2">${lab(L('Katalógus fokozata','Catalog tier'),`<select id="wt_${key}" data-chg="wTier" data-k="${key}">${tierOpts(ft)}</select>`)}${lab(L('Fegyver','Weapon')+` (${list.length})`,pickSel)}</div>`;
 if(w){h+=`<div class="row" style="margin-top:8px"><b>${gName(w)}</b><span class="tag">${N(TR[w.trait])}</span><span class="tag">${N(RANGES[w.range])}</span><span class="tag h num">${dmgStr(w,d)} ${dtN(w.dtype)}</span><span class="tag">${+w.hands===2?T('Kétkezes','Two-Handed'):T('Egykezes','One-Handed')}</span><span class="tag">T${w.tier||1}</span></div>${featLine(w)}
  <details style="margin-top:8px"><summary class="small">${L('Értékek kézi szerkesztése','Edit stats manually')}</summary><div class="grid g3">
   ${lab(L('Egyéni név','Custom name'),fText(key+'.custom',''))}${lab(T('Tulajdonság','Trait'),fSel(key+'.trait',TRAITS.map(t=>[t.id,P(t)])))}${lab(T('Hatótáv','Range'),fSel(key+'.range',optsOf(RANGES)))}
   ${lab(L('Sebzéskocka','Damage die'),fSel(key+'.die',[4,6,8,10,12,20].map(x=>[x,'d'+x]),'data-num'))}${lab(L('Sebzésbónusz','Damage bonus'),fNum(key+'.bonus',-5,40))}
   ${lab(L('Típus','Type'),fSel(key+'.dtype',[['phy',L('fizikai','physical')],['mag',L('mágikus','magic')],['both',L('mindkettő','either')]]))}${lab(L('Kéz','Hands'),fSel(key+'.hands',[[1,'1'],[2,'2']],'data-num'))}
   ${lab(L('Tulajdonság neve','Feature name'),fText(key+'.featName',''))}${lab(L('Tulajdonság szövege (angol szabályszöveg – a lap ebből számol)','Feature text (the sheet reads its numbers)'),fText(key+'.featText','','data-re'))}</div></details>`}
 return h}
function armorEditor(c,d){const a=c.armor,ft=ui.wTier.armor||(a&&a.tier)||d.tier;const list=ACAT.map((x,i)=>[x,i]).filter(([x])=>x.tier===ft);
 let h=`<div class="grid g2">${lab(L('Katalógus fokozata','Catalog tier'),`<select id="wt_armor" data-chg="wTier" data-k="armor">${tierOpts(ft)}</select>`)}
  ${lab(L('Páncél','Armor')+` (${list.length})`,`<select id="ar_pick" data-chg="setArmor"><option value="">${a?L('— csere a katalógusból —','— swap from catalog —'):L('— válassz —','— choose —')}</option>${list.map(([x,i])=>`<option value="${i}">${esc(gPlain(x))} · ${x.major}/${x.severe} · ${L('érték','score')} ${x.score}${x.featName?' · '+esc(x.featName):''}</option>`).join('')}${a?`<option value="none">${L('✕ páncél nélkül','✕ unarmored')}</option>`:''}</select>`)}</div>`;
 if(a){h+=`<div class="row" style="margin-top:8px"><b>${gName(a)}</b><span class="tag num">${T('Alapküszöbök','Base thresholds')} ${a.major} / ${a.severe}</span><span class="tag num">${T('Páncélérték','Armor Score')} ${a.score}</span><span class="tag">T${a.tier||1}</span></div>${featLine(a)}
  <details style="margin-top:8px"><summary class="small">${L('Értékek kézi szerkesztése','Edit stats manually')}</summary><div class="grid g3">${lab(L('Egyéni név','Custom name'),fText('armor.custom',''))}${lab(L('Jelentős küszöb','Major threshold'),fNum('armor.major',0,60))}${lab(L('Súlyos küszöb','Severe threshold'),fNum('armor.severe',0,99))}${lab(T('Páncélérték','Armor Score'),fNum('armor.score',0,12))}${lab(L('Tulajdonság neve','Feature name'),fText('armor.featName',''))}${lab(L('Tulajdonság szövege','Feature text'),fText('armor.featText','','data-re'))}</div></details>`}
 else h+=`<p class="small muted" style="margin-top:8px">${L('Páncél nélkül: Jelentős küszöb = szint, Súlyos küszöb = 2 × szint, Páncélérték 0.','Unarmored: Major threshold = level, Severe threshold = 2 × level, Armor Score 0.')}</p>`;
 return h}
function edGear(c,d){const burden=d.burden>2&&c.classId!=='warrior';return `<div class="stack">
 <div><h3>${T('Fő fegyver','Primary weapon')}</h3>${weaponEditor(c,d,1)}</div><hr>
 <div><h3>${T('Másodlagos fegyver','Secondary weapon')}</h3>${weaponEditor(c,d,2)}</div>
 ${burden?`<p class="note d">${L('Teher: két kezed van. Kétkezes fő fegyver mellé nem fér másodlagos fegyver.','Burden: you have two hands. A two-handed primary leaves no hand for a secondary weapon.')}</p>`:''}
 ${d.burden>2&&c.classId==='warrior'?`<p class="note">${L('Harcos – Harci kiképzés: a teher szabályt figyelmen kívül hagyod.','Warrior – Combat Training: you ignore burden.')}</p>`:''}<hr>
 <div><h3>${T('Páncél','Armor')}</h3>${armorEditor(c,d)}</div></div>`}

function cardPicker(c,d,maxLevel){const doms=[...d.domains,...(d.mcDom&&!d.domains.includes(d.mcDom)?[d.mcDom]:[])];if(!doms.includes(ui.cardDom))ui.cardDom=doms[0];const dom=ui.cardDom;
 const cap=dom===d.mcDom&&!d.domains.includes(dom)?Math.min(maxLevel,d.mcCap):maxLevel;const have=new Set(c.cards.map(x=>x.domain+'|'+x.name));
 const list=CARDCAT.filter(x=>x.domain===dom&&x.level<=cap);
 return `<div class="row">${doms.map(x=>`<button class="btn sm ${x===dom?'fear':''}" data-act="cardDom" data-d="${x}">${P(DOMAINS[x])}${lang==='hu'?' ('+DOMAINS[x].en+')':''}</button>`).join('')}<span class="small muted">${L('legfeljebb','up to')} ${cap}. ${L('szint','level')} · ${list.length} ${L('kártya','cards')}</span></div>
 <p class="small muted" style="margin-top:6px">${mdi(SRD.domains[DOMAINS[dom].en]||'')}</p>
 <div class="list" style="margin-top:8px">${list.map(x=>{const h=have.has(dom+'|'+x.name);return `<div class="li top catrow"><details class="grow"><summary><span class="tag num" style="background:var(--d-${dom});color:#fff">${x.level}</span> ${esc(x.name)} <span class="tag">${typeN(x.type)}</span> <span class="small muted" style="font-family:var(--body);font-weight:400">${L('előhívás','recall')} ${x.recall}</span></summary><div class="ctext">${md(x.text)}</div></details><button class="btn sm ${h?'':'pri'}" ${h?'disabled':''} data-act="addCard" data-d="${dom}" data-n="${esc(x.name)}">${h?'✓':'+ '+L('Felvesz','Add')}</button></div>`}).join('')}</div>`}
function subFeats(sub,subTier){const s=SRD.subclasses[sub.en];if(!s)return `<p class="orig">${sub.f}</p>`;
 return [['foundation',T('Alap','Foundation')],['specialization',T('Specializáció','Specialization')],['mastery',T('Mesterfok','Mastery')]].map(([k,n],i)=>{const body=s[k].map(f=>`<div class="feat"><h3>${esc(f.name)}</h3><div class="ctext">${md(f.text)}</div></div>`).join('');
  return i<subTier?`<div class="feat"><span class="src">${n}</span></div>${body}`:`<details style="margin-top:6px"><summary class="small">${n} – ${L('még nem érhető el','not unlocked yet')}</summary>${body}</details>`}).join('')}
function beastPanel(d){const bf=SRD.beastforms.filter(x=>+x.tier<=d.tier);return `<div class="panel"><h2>${T('Állatalakok','Beastforms')} <span class="muted small">${L('fokozat','tier')} ≤ ${d.tier}</span></h2><div class="list">${bf.map(x=>`<details><summary><span class="tag h num">T${x.tier}</span> ${esc(x.name)} <span class="small muted" style="font-family:var(--body);font-weight:400">${esc(x.examples||'')}</span></summary><div class="ctext"><p><span class="tag">${esc(x.trait_bonus||'')}</span> <span class="tag">${esc(x.evasion_bonus||'')}</span> <span class="tag h">${esc(x.attack||'')}</span></p><p class="small"><b>${T('Előny','Advantages')}:</b> ${esc(x.advantages||'')}</p>${(x.feature||[]).map(f=>`<p><b>${esc(f.name)}:</b> ${mdl(f.text)}</p>`).join('')}</div></details>`).join('')}</div></div>`}

/* ============ creation wizard ============ */
const WSTEPS=[b('Osztály','Class'),b('Örökség','Heritage'),b('Tulajdonságok','Traits'),b('Felszerelés','Equipment'),b('Tapasztalatok','Experiences'),b('Tartománykártyák','Domain cards'),b('Háttér','Background')];
function vWizard(c,d){const s=c.creating;let body='';
 if(s===0)body=edIdentity(c,d)+`<div style="margin-top:8px">${featBlock(T('Remény-képesség','Hope feature'),d.cls.hope)}${d.cls.feats.map(f=>featBlock(T('Osztályképesség','Class feature'),f)).join('')}<div class="feat"><span class="src">${T('Alosztály – alapképességek','Subclass – foundation')}</span><h3>${N(d.sub)}</h3><p class="small muted">${esc((SRD.subclasses[d.sub.en]||{}).desc||'')}</p>${subFeats(d.sub,1)}</div></div><details style="margin-top:8px"><summary class="small">${L('Az osztály leírása (angol)','Class description')}</summary><p class="small">${esc(d.cls.desc||'')}</p></details>`;
 if(s===1)body=edHeritage(c);
 if(s===2)body=edTraits(c)+(d.cls.sug?`<div class="row" style="margin-top:8px"><button class="btn sm" data-act="sugTraits">${L('Az osztály javasolt kiosztása','Use the class\'s suggested traits')}</button><span class="small muted num">${esc(d.cls.sug.traits)}</span></div>`:'');
 if(s===3)body=(d.cls.sug?`<div class="row" style="margin-bottom:10px"><button class="btn sm" data-act="sugGear">${L('Javasolt felszerelés','Use suggested equipment')}</button><span class="small muted">${esc([d.cls.sug.primary,d.cls.sug.secondary,d.cls.sug.armor].filter(Boolean).join(' · '))}</span></div>`:'')+edGear(c,d)+`<hr><p class="small">${L('Minden hős kap még: fáklya, 15 m kötél, alapfelszerelés, egy marék arany, és választ egy Kisebb gyógyitalt vagy Kisebb állóképesség-italt, valamint egy osztálytárgyat:','Every hero also takes: a torch, 50 ft. of rope, basic supplies, a handful of gold, and either a Minor Health Potion or a Minor Stamina Potion, plus a class item:')} <b>${P(d.cls.item)}</b></p><div class="row" style="margin-top:6px"><button class="btn sm" data-act="addItem" data-n="${L('Kisebb gyógyital (Minor Health Potion)','Minor Health Potion')}">+ ${T('Kisebb gyógyital','Minor Health Potion')}</button><button class="btn sm" data-act="addItem" data-n="${L('Kisebb állóképesség-ital (Minor Stamina Potion)','Minor Stamina Potion')}">+ ${T('Kisebb állóképesség-ital','Minor Stamina Potion')}</button><button class="btn sm" data-act="addItem" data-n="${esc(P(d.cls.item))}">+ ${L('Osztálytárgy','Class item')}</button></div><p class="small muted" style="margin-top:6px">${L('Táskában','In pack')}: ${c.items.map(i=>esc(i.name)).join(', ')}</p>`;
 if(s===4)body=edExperiences(c,d);
 if(s===5)body=`<p class="small muted">${L('Válassz két 1. szintű kártyát az osztályod tartományaiból (lehet mindkettő ugyanabból).','Choose two level 1 cards from your class domains (both may come from the same domain).')}</p><div style="margin-top:8px">${cardPicker(c,d,1)}</div><div class="list" style="margin-top:10px">${c.cards.map((k,i)=>`<div class="li"><span class="tag">${P(DOMAINS[k.domain])}</span><b>${esc(k.name)}</b><button class="btn sm warn" data-act="delCard" data-i="${i}">${L('Eltávolít','Remove')}</button></div>`).join('')}</div><p class="note ${c.cards.length===2?'g':'d'}" style="margin-top:8px">${c.cards.length}/2 ${L('kártya kiválasztva','cards chosen')}</p>`;
 if(s===6){const issues=[];if(!c.name)issues.push(L('Nincs név','No name'));if(!traitCheck(c))issues.push(L('A tulajdonságok kiosztása nem szabályos','Trait assignment is not valid'));if(c.experiences.some(e=>!e.name))issues.push(L('Hiányzó Tapasztalat-név','Experience name missing'));if(c.cards.length!==2)issues.push(L('Nem pontosan 2 tartománykártya','Not exactly 2 domain cards'));if(d.burden>2&&c.classId!=='warrior')issues.push(L('Túl sok kéz kell a fegyverekhez','Weapons need too many hands'));
  const qs=a=>a&&a.length?`<ul class="small muted" style="margin:0;padding-left:18px">${a.map(q=>`<li>${esc(q)}</li>`).join('')}</ul>`:'';body=`<div class="stack">${lab(L('Külső, megjelenés','Description, appearance'),fArea('desc','',3))}<div><b>${T('Háttérkérdések','Background questions')}</b>${qs(d.cls.bg)}</div>${lab(L('Háttér – válaszok','Background – your answers'),fArea('background','',4))}<div><b>${T('Kapcsolatkérdések','Connection questions')}</b>${qs(d.cls.conn)}</div>${lab(L('Kapcsolatok a csapat többi tagjával','Connections with the other party members'),fArea('connections','',4))}
  <div class="note ${issues.length?'d':'g'}"><b>${L('Szabályellenőrzés','Rules check')}:</b> ${issues.length?issues.join(' · '):L('Minden rendben, a karakter szabályos 1. szintű hős.','All good – a legal level 1 hero.')}</div></div>`}
 return `<section class="blk"><div class="row"><h2 class="grow">${L('Karakteralkotás','Character creation')}</h2><div class="steps">${WSTEPS.map((x,i)=>`<span class="${i===s?'cur':''}">${i+1}. ${P(x)}</span>`).join('')}</div></div>
 <div class="panel"><h3>${s+1}. ${N(WSTEPS[s])}</h3>${body}</div>
 <div class="row"><button class="btn" data-act="wiz" data-d="-1" ${s===0?'disabled':''}>← ${L('Vissza','Back')}</button><span class="grow"></span>${S.chars.length>1?`<button class="btn warn" data-act="delChar">${ui.confirm==='del'?L('Biztosan törlöd?','Really delete?'):L('Elvetés','Discard')}</button>`:''}
 ${s<6?`<button class="btn pri" data-act="wiz" data-d="1">${L('Tovább','Next')} →</button>`:`<button class="btn pri" data-act="wizDone">${L('Kész – irány a kaland!','Done – on to adventure!')}</button>`}</div></section>`}

/* ============ sheet tab ============ */
function vSheet(c,d){
 const traitsH=TRAITS.map(t=>`<div class="trait ${d.marked[t.id]?'marked':''}"><span class="v shield num">${sgn(d.traits[t.id].v)}</span><span class="tn">${N(t)}</span><span class="small muted" style="font-size:.78rem">${P(t.v)}</span>${d.marked[t.id]?`<span class="tag h">${L('megjelölve','marked')}</span>`:''}<button class="btn sm" data-act="quickRoll" data-t="${t.id}" style="margin-top:4px">${L('Dobás','Roll')}</button></div>`).join('');
 const stat=(n,v,why,p)=>`<div class="stat"><span class="v num">${v}</span><div class="grow"><b>${n}</b><div class="why">${why}</div></div>${p?stepper('mods.'+p,-10,10):''}</div>`;
 const wRow=(w,sl)=>w?`<div class="li"><b class="grow">${wName(w)}</b><span class="tag">${P(TR[w.trait])} ${sgn(d.traits[w.trait].v)}</span><span class="tag">${P(RANGES[w.range])}</span><span class="tag h num">${dmgStr(w,d)}</span><button class="btn sm pri" data-act="attack" data-s="${sl}">${L('Támadás','Attack')}</button>${featLine(w)?`<div style="flex-basis:100%">${featLine(w)}</div>`:''}</div>`:'';
 return `<section class="blk">
 <div class="grid g6">${traitsH}</div>
 <div class="grid g2">
  <div class="panel"><h2>${L('Számított értékek','Calculated values')}</h2><p class="small muted" style="margin-bottom:6px">${L('A lap magától számol; a jobb oldali léptetőkkel adhatsz egyéni módosítót (pl. kártyából, tárgyból).','The sheet does the math; the steppers on the right add a manual modifier (e.g. from a card or item).')}</p>
   ${stat(T('Kitérés','Evasion'),d.evasion.v,d.evasion.why,'evasion')}${stat(T('Páncélérték','Armor Score'),d.armor.v,d.armor.why||'—','armor')}
   ${stat(T('Jelentős küszöb','Major threshold'),d.major.v,d.major.why,'major')}${stat(T('Súlyos küszöb','Severe threshold'),d.severe.v,d.severe.why,'severe')}
   ${stat(T('Jártasság','Proficiency'),d.prof.v,d.prof.why,'proficiency')}${stat(T('Életpont-helyek','Hit Point slots'),d.hpS.v,d.hpS.why,'hp')}${stat(T('Stressz-helyek','Stress slots'),d.stS.v,d.stS.why,'stress')}</div>
  <div class="stack">
   <div class="panel"><h2>${T('Fegyverek','Weapons')}</h2><div class="list">${wRow(c.primary,1)}${wRow(c.secondary,2)}${!c.primary&&!c.secondary?`<span class="muted">${L('Nincs felszerelt fegyver.','No weapon equipped.')}</span>`:''}</div></div>
   <div class="panel"><h2>${T('Tapasztalatok','Experiences')}</h2>${edExperiences(c,d)}</div>
   <div class="panel"><h2>${T('Állapotok','Conditions')}</h2><div class="row">${CONDS.map(x=>`<button class="btn sm ${c.conds.includes(x.id)?'fear':''}" data-act="cond" data-k="${x.id}" title="${esc(P(x.t))}">${P(x.n)}${lang==='hu'?' ('+x.n.en+')':''}</button>`).join('')}</div>
    ${c.conds.map(k=>{const x=CONDS.find(q=>q.id===k);return x?`<p class="small" style="margin-top:6px"><b>${P(x.n)}:</b> ${P(x.t)}</p>`:''}).join('')}
    <h3 style="margin-top:12px">${L('Számlálók','Counters')}</h3><p class="small muted">${L('Jelzőkhöz, kockákhoz, napi képességekhez (pl. Imakockák, Seaborne-jelzők, Megállíthatatlan kocka).','For tokens, dice and limited-use features (e.g. Prayer Dice, Seaborne tokens, Unstoppable Die).')}</p>
    <div class="list" style="margin-top:6px">${c.counters.map((k,i)=>`<div class="li"><span class="grow">${fText('counters.'+i+'.name',L('Megnevezés','Name'))}</span>${stepper('counters.'+i+'.val',0,99)}<button class="btn sm warn" data-act="delCounter" data-i="${i}" aria-label="${L('Törlés','Delete')}">×</button></div>`).join('')}<div><button class="btn sm" data-act="addCounter">+ ${L('Számláló','Counter')}</button></div></div></div>
  </div></div>
 <div class="grid g2">
  <div class="panel"><h2>${T('Osztályképességek','Class features')} – ${N(d.cls)}</h2>${featBlock(T('Remény-képesség','Hope feature'),d.cls.hope)}${d.cls.feats.map(f=>featBlock(T('Osztályképesség','Class feature'),f)).join('')}
   ${c.classId==='wizard'?`<div class="row" style="margin-top:6px"><span>${T('Különös minták száma','Strange Patterns number')}:</span>${stepper('strange',1,12)}</div>`:''}
   <div class="feat"><span class="src">${T('Alosztály','Subclass')} · ${[T('Alap','Foundation'),T('Specializáció','Specialization'),T('Mesterfok','Mastery')][d.subTier-1]}</span><h3>${N(d.sub)}</h3>${d.sub.spell?`<p class="small">${T('Varázsdobás','Spellcast Roll')}: ${P(TR[d.sub.spell])} ${sgn(d.traits[d.sub.spell].v)}</p>`:''}
   ${subFeats(d.sub,d.subTier)}${fArea('subNotes',L('Saját megjegyzések az alosztályhoz…','Your own notes on the subclass…'),2)}</div>${c.multiclass?(()=>{const mc=CLASSES[c.multiclass.classId],ms=mc.subs.find(x=>x.id===c.multiclass.subId)||mc.subs[0];return `<hr><h2>Multiclass – ${N(mc)}</h2>${mc.feats.map(f=>featBlock(T('Osztályképesség','Class feature'),f)).join('')}<div class="feat"><span class="src">${T('Alosztály','Subclass')}</span><h3>${N(ms)}</h3>${subFeats(ms,1)}</div>`})():''}</div>
  <div class="panel"><h2>${T('Örökség','Heritage')}</h2>${featBlock(T('Származás','Ancestry')+' · '+P(ANC[c.anc1]),ANC[c.anc1].f[0])}${featBlock(T('Származás','Ancestry')+' · '+P(ANC[c.anc2]),ANC[c.anc2].f[1])}${featBlock(T('Közösség','Community')+' · '+P(COMM[c.community]),COMM[c.community])}</div></div>
 ${c.classId==='druid'||(c.multiclass&&c.multiclass.classId==='druid')?beastPanel(d):''}
 <details class="panel"><summary>${L('Alapadatok szerkesztése (név, osztály, örökség, tulajdonságok)','Edit basics (name, class, heritage, traits)')}</summary><div class="stack">${edIdentity(c,d)}<hr>${edHeritage(c)}<hr><h3>${L('Kezdő tulajdonságok','Starting traits')}</h3>${edTraits(c)}
  <hr><div class="row"><span>${T('Hegek','Scars')} (${L('áthúzott Remény-helyek','crossed-out Hope slots')}):</span>${stepper('scars',0,6)}</div>
  <div class="row"><button class="btn warn" data-act="delChar">${ui.confirm==='del'?L('Biztosan törlöd? Kattints újra.','Really delete? Click again.'):L('Karakter törlése','Delete character')}</button></div></div></details>
 </section>`}

/* ============ play tab ============ */
function parseDice(s){let tot=0,parts=[];const re=/([+-]?)\s*(\d*)d(\d+)|([+-]?)\s*(\d+)/gi;let m;while((m=re.exec(s||''))){if(m[3]){const n=Math.min(+(m[2]||1),50),sg=m[1]==='-'?-1:1;for(let i=0;i<n;i++){const r=rnd(+m[3]);tot+=sg*r;parts.push((sg<0?'−':'')+r)}}else if(m[5]){const v=(m[4]==='-'?-1:1)*+m[5];tot+=v;parts.push(sgn(v))}}return {tot,parts}}

  intake=`<div class="note d" style="margin-top:8px"><b>${amt}</b> ${L('sebzés','damage')} → ${names[sev]}${useA?` → ${L('páncéllal','with armor')}: ${names[fin]}`:''} → <b>${fin} ${T('Életpont','HP')}</b>
   <div class="row" style="margin-top:6px"><label class="chk"><input type="checkbox" id="useArmor" data-chg="intakeArmor" ${useA?'checked':''} ${canArmor?'':'disabled'}>${L('Páncélhely jelölése (egy fokozattal enyhébb)','Mark an Armor Slot (one threshold lower)')}</label><button class="btn warn sm" data-act="applyDmg" data-hp="${fin}" data-armor="${useA?1:0}" data-amt="${amt}">${L('Elszenvedem','Take it')}</button></div>
   ${amt>=d.severe.v*2?`<p class="small" style="margin-top:4px">${L('Opcionális szabály (Massive Damage): a Súlyos küszöb kétszeresénél 4 ÉP.','Optional rule (Massive Damage): at twice your Severe threshold, mark 4 HP.')}</p>`:''}</div>`}
 const rs=ui.rest;let restH='';

 let wiz='';
 if(lv){const nl=c.level+1,nt=tierOf(nl),ach=[2,5,8].includes(nl);const st=advState(c,d,lv.picks,nl);const spent=lv.picks.reduce((s,p)=>s+ADV.find(o=>o.id===p.type).cost,0);
  const markedNow=new Set(ach&&nl>2?[]:TRAITS.filter(t=>d.adv.some(a=>a.type==='traits'&&a.traits.includes(t.id)&&tierOf(a.level)===nt)).map(t=>t.id));

/* ============ rules reference ============ */
const slug=t=>t.toLowerCase().replace(/&/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const RCH=[];RULES.forEach((x,i)=>{if(x.l<=3)RCH.push(i);x.ch=RCH.length?RCH[RCH.length-1]:0;x.lc=(x.t+'\n'+x.m).toLowerCase()});
const qToks=q=>q.toLowerCase().split(/\s+/).filter(t=>t.length>1);
const reEsc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function ruleResults(){const toks=qToks(ui.rule.q);if(!toks.length)return '';const phrase=ui.rule.q.trim().toLowerCase().replace(/\s+/g,' ');
 const hits=[];RULES.forEach((x,i)=>{if(toks.every(t=>x.lc.includes(t)))hits.push([toks.every(t=>x.t.toLowerCase().includes(t))?0:x.lc.includes(phrase)?1:2,i])});hits.sort((p,q)=>p[0]-q[0]||p[1]-q[1]);
 const re=new RegExp('('+toks.map(reEsc).join('|')+')','gi');
 return `<p class="small muted" style="margin:8px 0 4px">${hits.length} ${L('találat','matches')}${hits.length>60?' – '+L('az első 60 látszik','showing the first 60'):''}</p><div class="reslist">${hits.slice(0,60).map(([,i])=>{const x=RULES[i];const plain=x.m.replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/[*_#>|]+/g,' ').replace(/\s+/g,' ');const p=Math.max(0,plain.toLowerCase().indexOf(toks[0])-60);
  return `<a class="res" href="#rules" data-act="ruleOpen" data-i="${i}"><b>${esc(x.t).replace(re,'<mark>$1</mark>')}</b> <span class="small muted">${x.ch!==i?'‹ '+esc(RULES[x.ch].t):''}</span><br><span class="small">${p?'…':''}${esc(plain.slice(p,p+190)).replace(re,'<mark>$1</mark>')}…</span></a>`}).join('')}</div>`}
function ruleChapter(ci){let end=RULES.length;for(const j of RCH)if(j>ci){end=j;break}let h='';
 for(let i=ci;i<end;i++){const x=RULES[i];h+=`<section id="rs_${i}"><h${x.l} class="mh">${esc(x.t)}</h${x.l}>${md(x.m)}</section>`}return h}
function hlite(root,toks){if(!root||!toks||!toks.length||!document.createTreeWalker)return;const re=new RegExp('('+toks.map(reEsc).join('|')+')','gi');const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];while(tw.nextNode())ns.push(tw.currentNode);
 for(const n of ns){re.lastIndex=0;if(!re.test(n.nodeValue))continue;const sp=document.createElement('span');sp.innerHTML=esc(n.nodeValue).replace(re,'<mark>$1</mark>');n.replaceWith(...sp.childNodes)}}
function vRules(){const R=(hu,en,body)=>`<div class="panel"><h3>${T(hu,en)}</h3>${body.map(x=>TX(b(x[0],x[1]))).join('<hr>')}</div>`;const r=ui.rule;
 if(!RULES.length)return `<section class="blk"><p class="note d">${L('A szabálykönyv adatfájlja (data/srd-rules.js) nem töltődött be.','The rulebook data file (data/srd-rules.js) did not load.')}</p></section>`;
 const ci=RCH.indexOf(r.ch),prev=RCH[ci-1],next=RCH[ci+1];
 const nav=`<div class="row">${prev!=null?`<button class="btn sm" data-act="ruleChapGo" data-i="${prev}">← ${esc(RULES[prev].t)}</button>`:''}<span class="grow"></span>${next!=null?`<button class="btn sm" data-act="ruleChapGo" data-i="${next}">${esc(RULES[next].t)} →</button>`:''}</div>`;
 return `<section class="blk">
 <div class="panel"><h2>${L('Daggerheart alapszabályok – teljes SRD 1.0','Daggerheart core rules – full SRD 1.0')}</h2><p class="small muted" style="margin-bottom:8px">${L('A hivatalos System Reference Document teljes angol szövege, benne mind a 189 tartománykártya. Írj be egy vagy több szót (angolul), vagy válassz fejezetet.','The full text of the official System Reference Document, including all 189 domain cards. Type one or more words, or pick a chapter.')}</p>
  <div class="row"><input type="search" id="ruleQ" class="grow" style="min-width:180px" placeholder="${L('Keresés a szabályokban, pl. „vulnerable”, „recall cost”, „Rain of Blades”…','Search the rules, e.g. “vulnerable”, “recall cost”, “Rain of Blades”…')}" value="${esc(r.q)}">
   <select id="ruleCh" data-chg="ruleChap" style="width:auto;max-width:100%" aria-label="${L('Fejezet','Chapter')}">${RCH.map(i=>`<option value="${i}" ${i===r.ch?'selected':''}>${RULES[i].l===2?'':'   '}${esc(RULES[i].t)}</option>`).join('')}</select></div>
  <div id="ruleRes">${ruleResults()}</div></div>
 <article class="panel rules" id="ruleView">${nav}${ruleChapter(r.ch)}${nav}</article>
 <details class="panel"><summary>${L('Gyors magyar összefoglaló a legfontosabb szabályokról','Quick summary of the key rules')}</summary><div class="grid g2">
 ${R('Kettősség-dobás','Duality Roll',[['Dobj 2d12-vel (Remény- és Félelem-kocka), add hozzá a tulajdonságot és a módosítókat, és vesd össze a Nehézséggel. Remény magasabb: kapsz 1 Reményt. Félelem magasabb: a KM kap 1 Félelmet. Egyforma kockák: kritikus siker – 1 Remény és 1 Stressz törlése.','Roll 2d12 (Hope and Fear Die), add the trait and modifiers, compare to the Difficulty. Hope higher: you gain a Hope. Fear higher: the GM gains a Fear. Matching dice: critical success – gain a Hope and clear a Stress.'],['Előny: +1d6, hátrány: −1d6; kioltják egymást. Tapasztalat: 1 Reményért hozzáadható. Segítség: 1 Reményért a társad előnykockát dob. Reakciódobás nem termel Reményt vagy Félelmet.','Advantage: +1d6, disadvantage: −1d6; they cancel out. Experience: spend a Hope to add it. Help an Ally: spend a Hope to roll an advantage die for them. Reaction rolls don\'t generate Hope or Fear.']])}

 o.push(`## ${Tp('Értékek','Stats')}`,'');

 tbl([Tp('Életpont','Hit Points'),Tp('Stressz','Stress'),Tp('Páncélhelyek','Armor Slots'),Tp('Remény','Hope')],[[`${c.hp} / ${d.hpS.v}`,`${c.stress} / ${d.stS.v}`,`${c.armorMarked} / ${d.armor.v}`,`${c.hope} / ${d.hopeMax}`]]);
 o.push(`## ${Tp('Tulajdonságok','Traits')}`,'');tbl(TRAITS.map(t=>Np(t)),[TRAITS.map(t=>sgn(d.traits[t.id].v)+(d.marked[t.id]?' ✓':''))]);
 o.push(`## ${Tp('Tapasztalatok','Experiences')}`,'',...c.experiences.map((e,i)=>`- ${e.name||'—'} **${sgn(d.exps[i])}**`),'');
 o.push(`## ${Tp('Fegyverek és páncél','Weapons and armor')}`,'');
 const ws=[c.primary,c.secondary].filter(Boolean);if(ws.length)tbl([L('Fegyver','Weapon'),Tp('Tulajdonság','Trait'),Tp('Hatótáv','Range'),Tp('Sebzés','Damage'),L('Kéz','Hands'),'Feature'],ws.map(wline));
 if(c.armor)o.push(`**${Tp('Páncél','Armor')}:** ${gPlain(c.armor)} — ${Tp('alapküszöbök','base thresholds')} ${c.armor.major} / ${c.armor.severe}, ${Tp('Páncélérték','Armor Score')} ${c.armor.score}${c.armor.featName?` — ${c.armor.featName}: ${c.armor.featText}`:''}`,'');
 o.push(`## ${Tp('Képességek','Features')}`,'');
 ft(Tp('Remény-képesség','Hope feature'),Np(d.cls.hope.n),d.cls.hope.t);d.cls.feats.forEach(f=>ft(Np(d.cls),Np(f.n),f.t));
 const ss=SRD.subclasses[d.sub.en];if(ss)['foundation','specialization','mastery'].slice(0,d.subTier).forEach(k=>ss[k].forEach(f=>o.push(`#### ${f.name} — ${d.sub.en} (${k})`,'',f.text,'')));
 if(c.subNotes)o.push(c.subNotes,'');
 ft(P(ANC[c.anc1]),Np(ANC[c.anc1].f[0].n),ANC[c.anc1].f[0].t);ft(P(ANC[c.anc2]),Np(ANC[c.anc2].f[1].n),ANC[c.anc2].f[1].t);ft(P(COMM[c.community]),Np(COMM[c.community].n),COMM[c.community].t);
 if(c.cards.length){o.push(`## ${Tp('Tartománykártyák','Domain cards')}`,'');
  for(const loc of ['loadout','vault']){const ks=c.cards.filter(k=>(k.loc==='loadout')===(loc==='loadout'));if(!ks.length)continue;o.push(`### ${loc==='loadout'?Tp('Aktív pakli','Loadout'):Tp('Tároló','Vault')}`,'');
   for(const k of ks){const i=cardInfo(k);o.push(`#### ${k.name}`,'',`*${P(DOMAINS[k.domain]||b(k.domain,k.domain))} · ${L('szint','level')} ${k.level}${k.type?' · '+k.type:''} · ${Tp('előhívás','recall')} ${k.recall||0}*`,'');if(i)o.push(i.text,'');if(k.notes)o.push(k.notes,'')}}}
 o.push(`## ${Tp('Felszerelés','Inventory')}`,'',...c.items.map(i=>`- ${i.name}${i.qty!==1?' × '+i.qty:''}${i.desc?' — '+i.desc:''}`),'',`**${Tp('Arany','Gold')}:** ${c.gold.handfuls} ${Tp('marék','handfuls')}, ${c.gold.bags} ${Tp('zsák','bags')}, ${c.gold.chests} ${Tp('láda','chests')}`,'');
 if(c.counters.length)o.push(`**${L('Számlálók','Counters')}:** `+c.counters.map(k=>`${k.name||'—'}: ${k.val}`).join(', '),'');
 if(c.background)o.push(`## ${L('Háttér','Background')}`,'',c.background,'');
 if(c.connections)o.push(`## ${L('Kapcsolatok','Connections')}`,'',c.connections,'');
 if(c.levelUps.length){o.push(`## ${L('Fejlődés','Progress')}`,'');c.levelUps.forEach(l=>o.push(`- **${L('Szint','Level')} ${l.level}:** `+l.adv.map(a=>{const x=ADV.find(y=>y.id===a.type);return P(x.n).split(' (')[0]+(a.type==='traits'?' – '+a.traits.map(t=>P(TR[t])).join(', '):a.type==='exp'?' – '+a.idx.map(i=>(c.experiences[i]||{}).name||'#'+(i+1)).join(', '):'')}).join('; ')));o.push('')}
 const ns=c.notes.filter(n=>n.title||n.body);if(ns.length){o.push(`## ${L('Jegyzetek','Notes')}`,'');ns.forEach(n=>o.push(`### ${n.title||'—'}`,'',n.body,''))}
 if(c.sessions.length){o.push(`## ${L('Session-napló','Session journal')}`,'');c.sessions.forEach((x,i)=>{o.push(`### ${i+1}. ${x.title} (${x.date})`,'');if(x.summary)o.push(x.summary,'');if(x.npcs)o.push(`**${L('Szereplők, helyszínek','NPCs, places')}:** ${x.npcs}`,'');if(x.loot)o.push(`**${L('Zsákmány','Loot')}:** ${x.loot}`,'')})}
 o.push('---','','*Daggerheart SRD 1.0 © Critical Role, LLC. – Darrington Press Community Gaming License.*');

const b64u=u=>{let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64u=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const q=atob(t),u=new Uint8Array(q.length);for(let i=0;i<q.length;i++)u[i]=q.charCodeAt(i);return u};
const pipe=async(bytes,ts)=>new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ts)).arrayBuffer());
async function packChar(c){const o=JSON.parse(JSON.stringify(c));delete o.portrait;delete o.rolls;let j=JSON.stringify(o);if(j.length>40000){(o.sessions||[]).forEach(x=>x.events=[]);j=JSON.stringify(o)}
 const raw=new TextEncoder().encode(j);try{if(typeof CompressionStream==='undefined')throw 0;return 'DHDATA1:'+b64u(await pipe(raw,new CompressionStream('deflate-raw')))+':END'}catch(e){return 'DHDATA0:'+b64u(raw)+':END'}}
async function unpackChar(text){const m=/DHDATA([01]):([A-Za-z0-9_-]+):END/.exec(String(text).replace(/ﬁ/g,'fi').replace(/ﬂ/g,'fl').replace(/ﬀ/g,'ff').replace(/\s+/g,''));if(!m)return null;
 let u=ub64u(m[2]);if(m[1]==='1')u=await pipe(u,new DecompressionStream('deflate-raw'));return new TextDecoder().decode(u)}
